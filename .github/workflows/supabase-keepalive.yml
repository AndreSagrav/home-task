name: Supabase Keep-Alive

on:
  schedule:
    # Cada 6 horas (igual que hoja-t-cnica)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

jobs:
  keepalive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase REST API
        run: |
          API_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNocnNscGx4anpmam5mdnZhemd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2Nzc3OTcsImV4cCI6MjA4ODI1Mzc5N30.09_90M7rtJ12KeQcbipt_ohR2_uJoT1UsylddWD6rno"
          fi

          echo "Escribiendo en la BD (RPC ping_keepalive)..."
          RPC_STATUS=$(curl -s -o rpc.json -w "%{http_code}" \
            -X POST "https://chrslplxjzfjnfvvazgu.supabase.co/rest/v1/rpc/ping_keepalive" \
            -H "apikey: $API_KEY" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --connect-timeout 15 \
            --max-time 30)
          echo "RPC HTTP: $RPC_STATUS"; cat rpc.json; echo ""
          if [ "$RPC_STATUS" -lt 200 ] || [ "$RPC_STATUS" -ge 300 ]; then
            echo "Error: la escritura keep-alive falló (¿ejecutaste keepalive_setup.sql?)"
            exit 1
          fi

          echo "Enviando ping de actividad a Supabase..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "https://chrslplxjzfjnfvvazgu.supabase.co/rest/v1/houses?select=id&limit=1" \
            -H "apikey: $API_KEY" \
            -H "Authorization: Bearer $API_KEY" \
            --connect-timeout 15 \
            --max-time 30)

          echo "Código HTTP recibido: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Ping exitoso. La base de datos de Supabase se mantendrá activa."
          else
            echo "Error: Código HTTP $HTTP_STATUS recibido de Supabase."
            exit 1
          fi
